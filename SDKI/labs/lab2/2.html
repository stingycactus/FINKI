<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../../jquery/jquery-ui.css">
    <script src="../../jquery/jquery.js"></script>
    <script src="../../jquery/jquery-ui.js"></script>
</head>
<body>
<div class = "contacts">
    <h1 id="name">Cactus</h1>
    <button class="edit">change</button>
</div>

<div class="dialog">
    <input type="text" id="nameInput">
</div>
<script>
    $(document).ready(function () {
        let current;

        $(".dialog").dialog({
            autoOpen: false,
            modal: true,
            buttons: {
                "Save": function () {
                    current.find("#name").text($("#nameInput").val());
                    $(this).dialog("close");
                }
            }
        })

        $(".edit").click(function () {
            current = $(this).closest(".contacts");
            $("#nameInput").val(current.find("#name").text())
            $(".dialog").dialog("open");
        })
    })
</script>
</body>
</html>
